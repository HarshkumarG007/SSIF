name: SSIF Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov anyio
          pip install --no-deps -e .

      - name: Run Schema & Data Leakage Audits
        run: |
          python -c "
          from src.data_loader import load_retention, load_placement
          from src.validation.leakage_detector import check_retention_leakage, check_placement_leakage
          df_ret = load_retention()
          leakage_ret = check_retention_leakage(df_ret)
          assert not leakage_ret.has_critical_leakage, 'Critical data leakage detected in retention panel!'
          df_plc = load_placement()
          leakage_plc = check_placement_leakage(df_plc)
          assert not leakage_plc.has_critical_leakage, 'Critical data leakage detected in placement dataset!'
          print('Schema & Leakage Verification Passed!')
          "


      - name: Run Full Pytest Suite (41 Tests)
        run: |
          pytest tests/ -v --durations=10

      - name: Verify Key Pipeline CLI Entrypoints
        run: |
          python -m src.retention.resilience
          python -m src.dlsm.effectiveness_test
          python scripts/generate_notebooks.py
