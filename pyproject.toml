[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "student-success-intelligence"
version = "0.1.0"
description = "Cross-dataset AI/ML Research Framework: Academic Persistence, Employability & Digital Lifestyle"
requires-python = ">=3.11"
dependencies = [
    # Core data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",

    # Machine Learning
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",

    # Survival Analysis
    "lifelines>=0.28.0",
    "scikit-survival>=0.22.0",

    # Explainability
    "shap>=0.44.0",

    # Statistics & Visualization
    "statsmodels>=0.14.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Config & Validation
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",

    # Data profiling & validation
    "pandera>=0.18.0",
    "ydata-profiling>=4.6.0",

    # Experiment tracking
    "mlflow>=2.9.0",

    # Dashboard
    "streamlit>=1.30.0",

    # Clustering
    "hdbscan>=0.8.33",

    # Utilities
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
